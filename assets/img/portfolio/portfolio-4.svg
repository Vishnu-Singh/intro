<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">MLOPS · EDGE AI</text>

  <!-- Custom Artwork -->
  
        <!-- Central GKE Cluster Hexagon -->
        <polygon points="400,130 475,173 475,259 400,302 325,259 325,173" fill="rgba(24,210,110,0.14)" stroke="#18d26e" stroke-width="2.5"/>
        <text x="400" y="212" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff">GKE +</text>
        <text x="400" y="232" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#18d26e">MLflow</text>
        <!-- Edge nodes -->
        <g stroke="rgba(24,210,110,0.55)" stroke-width="2">
          <line x1="325" y1="216" x2="180" y2="216"/>
          <line x1="475" y1="216" x2="620" y2="216"/>
          <line x1="400" y1="302" x2="400" y2="370"/>
        </g>
        <rect x="110" y="184" width="84" height="64" rx="8" fill="rgba(255,255,255,0.05)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="152" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">EDGE 01</text>
        <rect x="606" y="184" width="84" height="64" rx="8" fill="rgba(255,255,255,0.05)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="648" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">EDGE 02</text>
        <rect x="340" y="362" width="120" height="54" rx="8" fill="rgba(255,255,255,0.05)" stroke="#18d26e" stroke-width="1.5"/>
        <text x="400" y="393" text-anchor="middle" font-family="monospace" font-size="11" fill="#d7f9e6">TERRAFORM</text>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Centralized Edge AI Platform</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">MLflow Model Registry • GKE &amp; Terraform for Energy Leader</text>
</svg>
