<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">PREDICTIVE ML</text>

  <!-- Custom Artwork -->
  
        <!-- Chart frame -->
        <line x1="130" y1="390" x2="670" y2="390" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <line x1="130" y1="140" x2="130" y2="390" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <!-- Confidence band -->
        <path d="M 150 350 Q 290 320 410 245 T 650 155 L 650 215 Q 510 265 410 295 T 150 370 Z" fill="rgba(24,210,110,0.14)"/>
        <!-- Trend line -->
        <path d="M 150 360 Q 290 330 410 270 T 650 185" fill="none" stroke="#18d26e" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Data points -->
        <circle cx="210" cy="342" r="5" fill="#38bdf8"/>
        <circle cx="310" cy="306" r="5" fill="#38bdf8"/>
        <circle cx="410" cy="270" r="6" fill="#18d26e" stroke="#fff" stroke-width="2"/>
        <circle cx="530" cy="222" r="5" fill="#38bdf8"/>
        <circle cx="650" cy="185" r="7" fill="#18d26e" stroke="#fff" stroke-width="2"/>
        <!-- Metric callout -->
        <rect x="520" y="114" width="140" height="44" rx="8" fill="rgba(24,210,110,0.18)" stroke="#18d26e" stroke-width="1.5"/>
        <text x="590" y="141" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#18d26e">+25% ACCURACY</text>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Predictive ML Analytics</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">Scikit-learn &amp; SageMaker • +25% Insight Accuracy</text>
</svg>
