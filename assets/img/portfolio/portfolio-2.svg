<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">COMPUTER VISION</text>

  <!-- Custom Artwork -->
  
        <!-- Stylized invoice / document -->
        <rect x="240" y="116" width="320" height="320" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
        <!-- Document header lines -->
        <rect x="270" y="146" width="120" height="14" rx="4" fill="rgba(255,255,255,0.22)"/>
        <rect x="270" y="172" width="190" height="8" rx="3" fill="rgba(255,255,255,0.12)"/>
        <!-- Bounding box 1 (YOLOv5) -->
        <rect x="266" y="202" width="268" height="72" rx="6" fill="rgba(24,210,110,0.1)" stroke="#18d26e" stroke-width="2" stroke-dasharray="6 4"/>
        <rect x="266" y="186" width="84" height="16" rx="3" fill="#18d26e"/>
        <text x="308" y="198" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#040404">YOLOv5 0.98</text>
        <line x1="286" y1="228" x2="480" y2="228" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
        <line x1="286" y1="248" x2="420" y2="248" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
        <!-- Bounding box 2 (OCR) -->
        <rect x="266" y="296" width="268" height="92" rx="6" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2"/>
        <rect x="266" y="280" width="76" height="16" rx="3" fill="#38bdf8"/>
        <text x="304" y="292" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#040404">OCR DATA</text>
        <line x1="286" y1="326" x2="500" y2="326" stroke="rgba(56,189,248,0.45)" stroke-width="4" stroke-linecap="round"/>
        <line x1="286" y1="348" x2="450" y2="348" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
        <line x1="286" y1="368" x2="390" y2="368" stroke="rgba(255,255,255,0.16)" stroke-width="4" stroke-linecap="round"/>
        <!-- Laser scan line -->
        <line x1="220" y1="276" x2="580" y2="276" stroke="#18d26e" stroke-width="2" opacity="0.85"/>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Document Intelligence &amp; OCR</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">YOLOv5 Product Detection • Tesseract OCR Extraction</text>
</svg>
