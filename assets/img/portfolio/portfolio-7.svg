<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">AWS · SERVERLESS</text>

  <!-- Custom Artwork -->
  
        <!-- API Gateway / FastAPI hub -->
        <rect x="130" y="210" width="150" height="110" rx="12" fill="rgba(24,210,110,0.14)" stroke="#18d26e" stroke-width="2"/>
        <text x="205" y="262" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#fff">FastAPI</text>
        <text x="205" y="284" text-anchor="middle" font-family="monospace" font-size="11" fill="#18d26e">REST APIs</text>

        <!-- Connectors -->
        <g stroke="url(#accentLine)" stroke-width="2" fill="none">
          <path d="M 280 245 L 410 175"/>
          <path d="M 280 265 L 410 265"/>
          <path d="M 280 285 L 410 355"/>
        </g>

        <!-- AWS Services -->
        <rect x="410" y="140" width="240" height="62" rx="8" fill="rgba(255,255,255,0.05)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="530" y="176" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">AWS LAMBDA + S3</text>

        <rect x="410" y="234" width="240" height="62" rx="8" fill="rgba(255,255,255,0.05)" stroke="#18d26e" stroke-width="1.5"/>
        <text x="530" y="270" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#18d26e">AMAZON ECS / EKS</text>

        <rect x="410" y="328" width="240" height="62" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
        <text x="530" y="364" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#d7f9e6">IAM &amp; CLOUDWATCH</text>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">AWS Partner Automation</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">FastAPI, Lambda, S3 &amp; EKS • 50%+ Manual Effort Reduced</text>
</svg>
