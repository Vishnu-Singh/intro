<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">GEN AI · AGENTIC</text>

  <!-- Custom Artwork -->
  
        <!-- Agent graph edges -->
        <g stroke="url(#accentLine)" stroke-width="2" fill="none">
          <line x1="400" y1="160" x2="220" y2="270"/>
          <line x1="400" y1="160" x2="580" y2="270"/>
          <line x1="220" y1="270" x2="400" y2="380"/>
          <line x1="580" y1="270" x2="400" y2="380"/>
          <line x1="220" y1="270" x2="580" y2="270" stroke-dasharray="5 5"/>
        </g>
        <!-- Orchestrator node -->
        <circle cx="400" cy="160" r="42" fill="rgba(24,210,110,0.16)" stroke="#18d26e" stroke-width="2.5"/>
        <text x="400" y="164" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">ORCHESTRATOR</text>
        <!-- Tool Agent -->
        <circle cx="220" cy="270" r="38" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2"/>
        <text x="220" y="274" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">TOOLS</text>
        <!-- Vector Search -->
        <circle cx="580" cy="270" r="38" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2"/>
        <text x="580" y="274" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">VECTOR</text>
        <!-- Structured Memory -->
        <rect x="332" y="346" width="136" height="64" rx="10" fill="rgba(24,210,110,0.14)" stroke="#18d26e" stroke-width="2"/>
        <text x="400" y="382" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#d7f9e6">MEMORY</text>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Agentic RAG Platform</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">LangGraph Multi-Agent Tool Calling • Vector Search &amp; Memory</text>
</svg>
