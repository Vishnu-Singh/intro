<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">ML / AI · NLP</text>

  <!-- Custom Artwork -->
  
        <!-- Neural chat nodes -->
        <g stroke="url(#accentLine)" stroke-width="2" fill="none">
          <path d="M 180 260 C 260 260, 280 190, 360 190"/>
          <path d="M 180 260 C 260 260, 280 330, 360 330"/>
          <path d="M 440 190 C 510 190, 520 260, 600 260"/>
          <path d="M 440 330 C 510 330, 520 260, 600 260"/>
        </g>
        <!-- Left chat bubble -->
        <rect x="100" y="222" width="110" height="76" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
        <line x1="122" y1="248" x2="186" y2="248" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <line x1="122" y1="266" x2="168" y2="266" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
        <!-- Center intent & NER nodes -->
        <rect x="345" y="156" width="110" height="68" rx="10" fill="rgba(24,210,110,0.12)" stroke="#18d26e" stroke-width="1.5"/>
        <text x="400" y="195" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#18d26e">INTENT</text>
        <rect x="345" y="296" width="110" height="68" rx="10" fill="rgba(24,210,110,0.12)" stroke="#18d26e" stroke-width="1.5"/>
        <text x="400" y="335" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#18d26e">NER</text>
        <!-- Right response bubble -->
        <rect x="575" y="216" width="125" height="88" rx="14" fill="rgba(24,210,110,0.15)" stroke="#18d26e" stroke-width="2"/>
        <circle cx="610" cy="260" r="6" fill="#18d26e"/>
        <circle cx="637" cy="260" r="6" fill="#18d26e" opacity="0.7"/>
        <circle cx="664" cy="260" r="6" fill="#18d26e" opacity="0.4"/>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Enterprise E-Commerce Chatbot</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">PyTorch Intent &amp; NER Pipelines • FastAPI Microservices</text>
</svg>
