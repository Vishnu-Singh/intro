<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0e"/>
      <stop offset="55%" stop-color="#0c1419"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18d26e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18d26e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#18d26e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glowEmerald)"/>
  <rect width="800" height="600" fill="url(#glowCyan)"/>

  <!-- Subtle outer frame -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Top category pill -->
  <rect x="44" y="42" width="180" height="28" rx="14" fill="rgba(24,210,110,0.12)" stroke="rgba(24,210,110,0.35)" stroke-width="1"/>
  <circle cx="62" cy="56" r="4" fill="#18d26e"/>
  <text x="76" y="60" font-family="Poppins, Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#d7f9e6">IOT &amp; EDGE</text>

  <!-- Custom Artwork -->
  
        <!-- PCB traces -->
        <g stroke="rgba(24,210,110,0.55)" stroke-width="2" fill="none">
          <path d="M 330 220 L 210 220 L 170 180"/>
          <path d="M 330 265 L 150 265"/>
          <path d="M 330 310 L 210 310 L 170 350"/>
          <path d="M 470 220 L 590 220 L 630 180"/>
          <path d="M 470 265 L 650 265"/>
          <path d="M 470 310 L 590 310 L 630 350"/>
        </g>
        <!-- Microcontroller chip -->
        <rect x="330" y="195" width="140" height="140" rx="14" fill="rgba(24,210,110,0.14)" stroke="#18d26e" stroke-width="2.5"/>
        <rect x="356" y="221" width="88" height="88" rx="8" fill="rgba(6,10,13,0.85)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="400" y="262" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff">ESP32</text>
        <text x="400" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#18d26e">EDGE MCU</text>
        <!-- Wireless telemetry arcs -->
        <path d="M 370 165 A 45 45 0 0 1 430 165" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 350 145 A 70 70 0 0 1 450 145" fill="none" stroke="#18d26e" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
        

  <!-- Bottom title bar -->
  <rect x="44" y="476" width="712" height="80" rx="10" fill="rgba(6,10,13,0.78)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="44" y1="476" x2="260" y2="476" stroke="#18d26e" stroke-width="2.5"/>
  <text x="64" y="510" font-family="Poppins, Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">IoT Data Acquisition</text>
  <text x="64" y="536" font-family="Open Sans, Inter, system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.68)">Raspberry Pi, Arduino, ESP32 • LoRaWAN &amp; CAN Bus</text>
</svg>
